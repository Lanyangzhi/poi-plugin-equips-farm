# Manual / fallback publish workflow.
# Automatic releases happen inside sync-akashi-data.yml (job `publish`),
# because pushes made with the default GITHUB_TOKEN do not trigger other
# workflows. This one can be used to publish the current master version
# manually (workflow_dispatch) or if a tag is pushed by other means.

name: Publish poi-plugin to npm

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          # Keep in sync with the npm major below: npm@12 requires
          # node ^22.22.2 || ^24.15.0 || >=26.0.0 (node 24 LTS satisfies it).
          node-version: 24
          registry-url: https://registry.npmjs.org/

      - name: Pin npm major version
        run: npm install -g npm@12

      - name: Check Node.js and npm versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: npm publish
        run: npm publish --provenance --access public
